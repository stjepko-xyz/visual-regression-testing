name: Visual regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  visual:
    runs-on: ubuntu-latest
    # Same image as the test:visual:docker scripts, so CI and local baseline
    # updates render identically. Keep the tag in sync with the playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:visual
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: .vitest
          # .vitest is a hidden folder, which upload-artifact@v4 skips by default
          include-hidden-files: true
          if-no-files-found: warn
